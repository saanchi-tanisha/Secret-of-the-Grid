<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SECRET OF THE GRID</title>

  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="home-screen" class="card">
    <h1>SECRET OF THE GRID</h1>
    <p>
      An anonymous signal just dropped an encrypted drive onto your terminal. 
      Inside lies <span class="highlight">The Phantom Cache</span>—five locked security vaults 
      left behind by a vanished architect. Crack the ciphers, uncover hidden clues, 
      and breach the core before the system locks you out forever.
    </p>
    <button id="startBtn">ENTER VAULT 1</button>
  </div>

  <div id="game-container" class="hidden">
    <canvas id="game" width="850" height="520"></canvas>
    <div class="controls">
      <button id="restartBtn">RESTART</button>
      <button id="nextBtn">ENTER VAULT 2</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
